sonar.projectKey=PUB
sonar.projectName=Public Tools
sonar.sources=ollama-shelf/src,template/src,topic/src,ytd/src
sonar.tests=ollama-shelf/tests,template/tests,topic/tests,ytd/tests

# The scanner image does not include Cargo. Clippy is already installed and
# enforced by the preceding CI step.
sonar.rust.clippy.enabled=false

# Produced by `make -f .makefile coverage` in the Lint, test & coverage step.
sonar.rust.lcov.reportPaths=coverage/ollama-shelf.lcov,coverage/template.lcov,coverage/topic.lcov,coverage/ytd.lcov
