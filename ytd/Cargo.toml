[package]
name = "ytd"
version = "0.1.0"
edition = "2024"
description = "Download videos and audio with yt-dlp"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
