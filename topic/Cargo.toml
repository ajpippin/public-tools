[package]
name = "topic"
version = "0.1.0"
edition = "2024"
description = "Browse and maintain a numbered personal topic library"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hostname = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3.20"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
